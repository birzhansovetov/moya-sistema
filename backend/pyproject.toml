[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "moya-sistema-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.13,<2",
  "psycopg[binary]>=3.2,<4",
  "argon2-cffi>=23,<26",
  "PyJWT>=2.8,<3",
  "httpx>=0.27,<1",
  "email-validator>=2,<3",
  "cryptography>=43,<52",
  "python-multipart>=0.0.12,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.content" = ["*.json", "ebooks/*.epub", "ebooks/README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
